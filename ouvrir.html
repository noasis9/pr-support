<!doctype html>
<!--
  Page « Ouvrir PR » (V2 de la connexion, 2026-10-27) — publiée sur le site de support
  (dépôt public noasis9/pr-support). Le bouton et le code du mail de connexion
  (supabase/emails/code-connexion.html) mènent ici avec #code=123456&h=<empreinte> :
  la page rouvre aussitôt l'app sur prscaffoldtmp://login?code=…&h=… (code rempli et
  validé tout seul), et propose en secours « Copier le code » (dans PR, toucher les
  cases colle le code). À changer si le « scheme » de l'app change (app.json).
  Ne marche pas avec Expo Go (autre adresse d'app) : seulement avec un build EAS.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Ouvrir PR</title>
    <style>
      @font-face { font-family: 'Alexandria'; font-weight: 400; src: url(polices/Alexandria-400.ttf) format('truetype'); }
      @font-face { font-family: 'Alexandria'; font-weight: 700; src: url(polices/Alexandria-700.ttf) format('truetype'); }
      @font-face { font-family: 'Alexandria'; font-weight: 800; src: url(polices/Alexandria-800.ttf) format('truetype'); }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 14px;
        background: #eef2fa;
        font-family: 'Alexandria', Helvetica, Arial, sans-serif;
        color: #0b1220;
      }
      .carte { width: 100%; max-width: 420px; background: #fff; border-radius: 20px; overflow: hidden; text-align: center; }
      .entete { background: linear-gradient(135deg, #33c5fa 0%, #005bfd 55%, #0129cd 100%); padding: 30px 20px; }
      .entete img { width: 110px; height: auto; display: block; margin: 0 auto; }
      .corps { padding: 30px 28px 32px; }
      h1 { margin: 0 0 10px; font-size: 22px; line-height: 28px; font-weight: 800; }
      p { margin: 0 0 22px; font-size: 15px; line-height: 22px; color: #3b4557; }
      .code {
        display: inline-block; margin: 0 0 24px; padding: 14px 14px 14px 24px; border-radius: 16px; border: 0;
        background: #eef2fa; color: #005bfd; font-family: inherit; font-size: 34px; font-weight: 800; letter-spacing: 10px; cursor: pointer;
      }
      .bouton {
        display: block; width: 100%; padding: 16px; border-radius: 999px; border: 0; cursor: pointer;
        font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none;
      }
      .principal { background: #005bfd; color: #fff; margin-bottom: 12px; }
      .secondaire { background: #fff; color: #005bfd; border: 1.5px solid #c9d6f2; }
      .aide { margin: 18px 0 0; font-size: 13px; line-height: 19px; color: #6b7585; }
    </style>
  </head>
  <body>
    <div class="carte">
      <div class="entete"><img src="logo-pr-blanc.png" alt="PR" /></div>
      <div class="corps">
        <h1>Ouverture de PR…</h1>
        <p>Si l'app ne s'ouvre pas toute seule, touche « Ouvrir PR » ou copie le code.</p>
        <button class="code" id="code" type="button" aria-label="Copier le code"></button>
        <a class="bouton principal" id="ouvrir" href="#">Ouvrir PR</a>
        <button class="bouton secondaire" id="copier" type="button">Copier le code</button>
        <p class="aide">Dans PR, touche les cases du code pour le coller.</p>
      </div>
    </div>
    <script>
      var params = new URLSearchParams(location.hash.slice(1));
      var code = (params.get('code') || '').replace(/\D/g, '').slice(0, 6);
      var empreinte = params.get('h') || '';
      var lien = 'prscaffoldtmp://login?code=' + code + '&h=' + encodeURIComponent(empreinte);
      document.getElementById('code').textContent = code;
      document.getElementById('ouvrir').href = lien;

      function copier() {
        var bouton = document.getElementById('copier');
        var fini = function () { bouton.textContent = 'Code copié ✓'; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(fini, fini);
        } else {
          var champ = document.createElement('textarea');
          champ.value = code;
          document.body.appendChild(champ);
          champ.select();
          document.execCommand('copy');
          document.body.removeChild(champ);
          fini();
        }
      }
      document.getElementById('copier').addEventListener('click', copier);
      document.getElementById('code').addEventListener('click', copier);

      if (code && empreinte) window.location.href = lien;
    </script>
  </body>
</html>
